<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Project5: Comparisons and Type Coercion</title>
    </head>
    <body>
        <h1>Comparisons and Type Coercion</h1>

        <!-- Paragraph where the results will be displayed -->
        <p id="Infinity"></p>
        <p id="NegativeInfinity"></p>

        <!-- Paragraphs where the Boolean results will be displayed -->
        <p id="True"></p>
        <p id="False"></p>

        <!-- Paragraphs where the equality results will be displayed -->
        <p id="Equal"></p>
        <p id="NotEqual"></p>

        <!-- Paragraphs where the strict equality results will be displayed -->
        <p id="StrictTrue"></p>
        <p id="StrictFalse1"></p>
        <p id="StrictFalse2"></p>
        <p id="StrictFalse3"></p>

        <!-- Paragraphs where the AND / OR results will be displayed -->
        <p id="AndTrue"></p>
        <p id="AndFalse"></p>
        <p id="OrTrue"></p>
        <p id="OrFalse"></p>

        <!-- Paragraphs where the NOT results will be displayed -->
        <p id="NotTrue"></p>
        <p id="NotFalse"></p>


        <!-- Link the main.js file using the script element and src attribute -->
        <script src="JS/main.js"></script>
    </body>
</html>
